[alembic]
script_location = migrations
# Postgres only: the URL comes from DATABASE_URL (app/db.py run_migrations or the CLI).
# This placeholder is used only when DATABASE_URL is not set at all.
sqlalchemy.url = postgresql+psycopg://hub:change-me@localhost:5432/hub

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
