# HomeMusic: Navidrome + Hub (search, downloads, uploads, AI).
# Linux host: Docker Engine with the Compose plugin and the NVIDIA Container
# Toolkit for the embedder.
# External access is handled outside this stack (NetBird or another VPN/mesh).
# Start / update:  docker compose up -d (hub and embedder are built first)
# Stop: docker compose down
# Settings come from .env (copy .env.example). MUSIC_ROOT is an absolute path
# on the Linux host.
name: homemusic

x-logging: &logging
  driver: local
  options:
    max-size: "5m"
    max-file: "3"

services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: homemusic_navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_CONFIGFILE: /config/navidrome.toml
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_DEFAULTLANGUAGE: ru
      ND_LASTFM_LANGUAGE: ru  # artist bios from Last.fm in Russian where they exist
      # the Hub calls startScan after every import; the hourly scan is a safety
      # net for external changes
      ND_SCANSCHEDULE: 1h
      ND_SCANNER_WATCHERENABLED: "false"
      ND_AUTOIMPORTPLAYLISTS: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLESHARING: "true"
      ND_LOGLEVEL: info
      # the Hub links its files to Navidrome song ids by path
      ND_SUBSONIC_DEFAULTREPORTREALPATH: "true"
      ND_BACKUP_PATH: /backups
      ND_BACKUP_SCHEDULE: "30 4 * * *"
      ND_BACKUP_COUNT: "7"
      ND_PASSWORDENCRYPTIONKEY: ${ND_PASSWORDENCRYPTIONKEY:?set ND_PASSWORDENCRYPTIONKEY in .env}
    volumes:
      - navidrome-data:/data
      - ./navidrome/navidrome.toml:/config/navidrome.toml:ro
      - ${MUSIC_ROOT:?set MUSIC_ROOT in .env}/library:/music:ro
      - ${MUSIC_ROOT}/.backups/navidrome:/backups
    logging: *logging

  # The Hub's database. Credentials come from .env; the Hub reaches
  # it over the compose network as postgres:5432.
  # External Postgres: point DATABASE_URL in .env at it
  # and drop this service.
  postgres:
    image: postgres:17
    container_name: homemusic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      # Cyrillic case-insensitive search needs UTF8 and a non-C ctype
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-hub} -d $${POSTGRES_DB:-hub}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: homemusic-hub:local
    # build the local image before starting
    # (equivalent to `docker compose up --build`)
    pull_policy: build
    container_name: homemusic_hub
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_started
      youtube-pot:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    # host services (Ollama, an outbound proxy) are reachable as
    # host.docker.internal on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MUSIC_ROOT: /music
      DATA_DIR: /data
      CONFIG_FILE: /config/config.yaml
      # from .env (default: postgres://hub@postgres/hub)
      NAVIDROME_URL: http://navidrome:4533
      YTDLP_POT_BASE_URL: http://youtube-pot:4416
      YTDLP_CACHE_DIR: /data/yt-dlp-cache
    volumes:
      - hub-data:/data
      - ${MUSIC_ROOT}:/music
      - ./config.yaml:/config/config.yaml:ro
      - soulseek-downloads:/soulseek-downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  # PO tokens for yt-dlp's mweb client. Internal only: no host port or cookie/music mounts.
  # Keep the image version in sync with bgutil-ytdlp-pot-provider in hub/pyproject.toml.
  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: homemusic_youtube_pot
    restart: unless-stopped
    init: true
    # host services (an outbound proxy) are reachable as
    # host.docker.internal on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4416"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  # Soulseek daemon, only with COMPOSE_PROFILES=soulseek (.env). The Hub talks to it over the compose network
  # (SLSKD_API_KEY) and takes finished files from the shared volume, removing them after the import.
  slskd:
    image: slskd/slskd:0.26.2
    profiles: [soulseek]
    restart: unless-stopped
    environment:
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME:-}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD:-}
      SLSKD_SLSK_PORT: ${SLSKD_SLSK_PORT:-2271}
      SLSKD_SLSK_CONNECTION_TIMEOUT: ${SLSKD_SLSK_CONNECTION_TIMEOUT:-5000}
      SLSKD_API_KEY: "role=ReadWrite;${SLSKD_API_KEY:-}"
      SLSKD_DOWNLOADS_DIR: /downloads
    expose:
      - "5030"
    volumes:
      - slskd-data:/app
      - soulseek-downloads:/downloads
    logging: *logging

  # Audio/text vectors (MuQ-MuLan) for mixes and «Моя волна» — MIXES.md, section 4.2. Only the compose network
  # reaches it (no published port): the Hub calls http://embedder:8090 (EMBEDDER_URL).
  embedder:
    build: ./embedder
    image: homemusic-embedder:local
    # build the local image before starting
    # (equivalent to `docker compose up --build`)
    pull_policy: build
    container_name: homemusic_embedder
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      EMBEDDER_TOKEN: ${EMBEDDER_TOKEN:-}
      DATA_DIR: /data
      MODELS_DIR: /models
      HF_HOME: /models/hf
      MUSIC_ROOT: /music
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - embedder-data:/data
      # weights (~3 GB) are downloaded on the first job and kept here, not in the image
      - embedder-models:/models
      - ${MUSIC_ROOT}/library:/music:ro
    # loading the model onto the GPU peaks at ~3.4 GB (with the checkpoint's page cache), working ~2.5 GB; a runaway
    # is killed here instead of taking down the whole host. No swap.
    # EMBEDDER_DEVICE=cpu needs ~7 GB: raise both limits first.
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

volumes:
  # Service state lives in named Docker volumes on the Linux host.
  # The Hub writes daily pg_dump backups into MUSIC_ROOT/.backups.
  postgres-data:
  navidrome-data:
  hub-data:
  embedder-data:
  embedder-models:
  slskd-data:
  soulseek-downloads:
