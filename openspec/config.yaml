schema: spec-driven

context: |
  Language: Русский
  All artifacts must be written in Русский.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  # Назначение
  HomeMusic — персональный музыкальный сервис для Linux-хоста. Он объединяет
  Hub (FastAPI + PWA) и отдельный embedder для звуковых векторов. Базовые спецификации
  фиксируют текущее поведение системы (As-Is): не добавляй новую функциональность,
  не описывай желаемое состояние и не превращай TODO/технический долг в требования.
  Рабочих инстансов нет: существующие данные и медиасервер не переносятся, поэтому
  требование «план миграции БД» означает план изменения схемы, а не перенос данных.

  # Технологический стек
  - Hub: Python 3.12, FastAPI 0.145, Pydantic 2.16, SQLAlchemy 2.1 async, Postgres,
    Alembic 1.20, httpx, sse-starlette, mutagen, ffmpeg/ffprobe, yt-dlp.
  - Web/PWA: React 19.3, TypeScript 7.0, Vite 8.3, Tailwind CSS 4.3.
  - Embedder: Python 3.12, FastAPI, NumPy 2.x, PyTorch 2.11, MuQ-MuLan, CUDA.
  - Инфраструктура: Docker Engine + Compose на Linux, S3-совместимое хранилище
    (RustFS в compose по умолчанию, внешний S3 через конфиг) как primary-хранилище
    библиотеки, локальный диск как staging и hot-cache, NetBird или аналог для
    внешнего доступа. Собственного gateway в проекте нет.
  - Android-приложение — отдельный репозиторий; Hub владеет только серверной частью контракта.

  # Архитектурные ограничения
  - Hub — модульный монолит: FastAPI-роутеры → Pydantic-схемы → доменные модули →
    SQLAlchemy-модели/Postgres.
  - Hub — источник истины для учёток, ♥, плейлистов, истории и каталога; ND
    не используется.
  - Postgres — единственная БД Hub; миграции обязательны, ручные изменения схемы недопустимы.
  - Очередь задач и EventBus сейчас in-process. Не проектируй изменения, которые молча
    ломают SSE или фоновые задачи при нескольких процессах.
  - `embedder` — отдельный сервис. Hub может работать без него: рекомендации теряют
    звуковой признак, но не должны падать.
  - S3 — primary-хранилище библиотеки; локальный диск хранит staging и hot-cache.
    Блобы и физические операции с файлами должны оставаться в домене `storage`,
    а метаданные — в `library`. Staging и hot-cache находятся под `MUSIC_ROOT`.
  - Собственного reverse proxy, SSH-туннеля и VPS-скриптов в проекте нет.

  # Серия navidrome-migration
  - Порядок этапов: 0 governance → 1 postgres → 2 storage → 3 catalog → 4 identity →
    5 user-data → 6 delivery → 7 decommission. Этап 4 может разрабатываться параллельно
    1–3, но MUST быть завершён до 6. `embedder-vector-store` вне серии и её не блокирует.
  - Политика delta-спек: базовые `openspec/specs/*` остаются As-Is до архивации
    соответствующего change; изменения поведения оформляются только delta-спеками
    внутри change и не требуют переписывать базовые спеки заранее.

  # Технический долг (td-*)
  - Отдельный change на одну тему долга: нейминг `td-<краткая-тема>` в kebab-case,
    вне серии `navidrome-migration`, без номера этапа.
  - Схема — `spec-driven`. Если долг не меняет контракт системы (тулинг, формат,
    типы), в `.openspec.yaml` ставится `skip_specs: true`; если меняет правило
    (например, «статическая проверка типов обязательна»), заводится capability
    `maintainability` с delta-спекой.
  - Обязательные артефакты: `proposal.md` (почему долг мешает и где границы работ),
    `design.md` (политика правок, риски, план проверки, откат) и `tasks.md`
    (группы по доменам/файлам, проверяемые шаги).
  - Требования: не менять поведение, API, схему БД и контракты клиентов; не смешивать
    техдолг с функциональными change'ами; не переносить список долга в базовые
    `openspec/specs/*` — As-Is спеки фиксируют поведение, а не TODO.
  - Проверки: `ruff check`, `ruff format --check`, `pytest`, при необходимости
    `pyright` и `npm run typecheck`. Форматный долг — отдельным коммитом
    и записью в `.git-blame-ignore-revs`.
  - Порядок: сначала завести change и перечислить долг, затем исправлять группами;
    задача не считается выполненной без прохождения релевантных проверок.

  # Домены Openspec
  - `persistence` — Postgres, Alembic-миграции, бэкапы и тестовая БД.
  - `auth` — вход, сессии, JWT, OIDC RP, инвайты, email, Google, администраторы.
  - `storage` — S3-блобы, пути, staging, hot-cache, trash, атомарные операции, ffprobe.
  - `library` — альбомы, треки, теги, обложки, manifest, плейлисты, импорт Hub.
  - `catalog-acquisition` — поиск, каталог, провайдеры, matching, загрузки, импорт.
  - `listening` — прослушивание до загрузки, стриминг, play events, ♥, дизлайки, скробблы.
  - `recommendations` — вкус, «Микс дня», «Моя волна», smart shuffle, векторы эмбеддера.
  - `assistant` — LLM, скриншоты, ссылки, чат с инструментами.
  - `system` — health, SSE, share target, Android-обновления, insights, housekeeping,
    клиентские capabilities. iOS сейчас не поддерживается.

  # Правила кода
  - Python: snake_case, модули по домену, type hints, `from __future__ import annotations`.
  - Pydantic-схемы: `*In` / `*Out`; не смешивай API-схемы с доменными моделями без причины.
  - Таблицы: plural snake_case; миграции Alembic с осмысленным revision message.
  - Job kinds и события: snake_case, стабильные имена.
  - TypeScript: компоненты PascalCase, функции camelCase; API-типы не дублируй вручную.
  - Тексты ошибок и интерфейса — на русском; структурные ключи OpenSpec — на английском.

  # БД и API
  - Любое изменение схемы БД MUST сопровождаться Alembic-миграцией.
  - Существующие API-поля и статусы MUST сохраняться, если изменение не объявлено
    ломающим. Для нового поведения клиентов используй capability в `/healthz`.
  - Ответы API — JSON; ошибки — `{"detail": "<русское сообщение>"}`.
  - Все защищённые endpoint'ы используют cookie `hm_session`; админские — `is_admin`.
  - Не логируй пароли, cookies, токены, содержимое `.env` и полные ответы LLM.
  - Для внешних источников используй существующие `Provider`, `Catalog` и `net`-адаптеры.
  - Блобы и метаданные меняются только через `storage` и `library`; прямые обращения
    к ND из доменов запрещены.
  - Для фоновой работы используй существующую очередь и `@handler`, а не новые потоки.

  # Тестирование
  - Python: pytest + pytest-asyncio + pytest-xdist + respx; тесты в `hub/tests`.
  - Тесты поднимают приложение in-process на мигрированной копии Postgres; диалектное
    расхождение с продакшеном недопустимо.
  - Внешние сервисы подменяются фейками; реальная сеть — только маркер `network`.
  - Изменения `storage` MUST проверяться smoke-тестом на реальном S3 (RustFS в compose)
    под маркером `s3` и env-гейтом `HUB_S3_TESTS=1`; smoke по умолчанию пропускается,
    маркер `s3` регистрируется в `hub/pyproject.toml` на этапе 2; smoke не ограничивается
    `LocalBackend`.
  - Embedder: `FakeModel`; реальная модель — маркер `gpu`.
  - Web: `npm run typecheck` и `npm run build`; dev-mock — `npm run dev:mock`.
  - Изменение поведения MUST сопровождаться тестом или явным объяснением, почему тест невозможен.

  # Клиенты
  - Основной клиент — PWA в обычном браузере и внутри Android WebView.
  - Android-приложение через bridge `HomeMusicAndroid` и эндпоинты `/app/*` остаются
    существующим контрактом, но не развиваются; их удаление — отдельный breaking-change
    вне серии.
  - iOS сейчас не поддерживается; не добавляй его в As-Is спецификации.
  - Клиентские возможности определяются через `/healthz.capabilities`, а не угадываются.
  - Android-обновления раздаются через `/app/latest.json`, `/app/latest.apk`,
    `/app/artifacts/*`; контракт обратной совместимости обязателен.

rules:
  proposal:
    - MUST указывать затронутые домены и спецификации OpenSpec.
    - MUST отделять текущее поведение (As-Is) от предлагаемого изменения.
    - MUST описывать влияние на API, БД, фоновые задачи и клиентов.
    - MUST указывать план проверки и обратной совместимости.
    - MUST NOT добавлять новую функциональность в базовые As-Is спецификации.
    - MUST NOT предлагать изменение схемы БД без Alembic-миграции.
    - MUST NOT предлагать ломающее изменение API без version/capability/миграционного плана.
    - MUST NOT описывать микросервисное выделение без границ данных и контрактов.
  design:
    - MUST описывать владельца данных и границы транзакций.
    - MUST описывать идемпотентность, retry и поведение при частичном сбое.
    - MUST считать Hub источником истины для учёток, ♥, плейлистов, истории и каталога;
      Navidrome не используется.
    - MUST использовать существующие адаптеры провайдеров и каталога.
    - MUST описывать обработку ошибок и формат ответов API.
    - MUST включать план миграции БД (Postgres + Alembic) и обратной совместимости API.
    - MUST хранить S3-блобы только через домен `storage`; ключ блоба — `sha256`,
      блобы иммутабельны; метаданные трека живут в БД и manifest.
    - MUST описывать `auth` как локальные учётки + JWT + OIDC RP; JWT передаётся
      в существующей HttpOnly-cookie `hm_session` на всём протяжении серии, payload
      меняется на этапе 4, имя/scope cookie — отдельный breaking-change.
    - MUST создавать новые объекты библиотеки только через импорт Hub; сканирование
      бакета запрещено.
    - MUST NOT добавлять прямые обращения к ND из доменов.
    - MUST NOT добавлять прямой доступ к файлам вне `storage`/`library`.
    - MUST NOT добавлять скрытые глобальные синглтоны и обход dependency injection.
    - MUST NOT ломать SSE-контракт и имена событий без явного решения.
  tasks:
    - MUST быть разбиты на проверяемые шаги.
    - MUST включать тесты для каждого изменения поведения.
    - MUST включать Alembic-миграцию и проверку отката, если меняется схема.
    - MUST включать проверку обратной совместимости API и клиентов.
    - "MUST включать команды проверки: pytest, ruff, typecheck/build."
    - MUST NOT отмечать задачу выполненной без прохождения релевантных тестов.
    - MUST NOT смешивать рефакторинг, миграцию данных и новую функциональность в одной задаче.

operations:
  apply:
    guidance:
      - Перед изменениями прочитай соответствующую спецификацию домена.
      - Сначала обнови delta-спеку внутри change; базовые `openspec/specs/*` меняются только при архивации.
      - Для изменений схемы проверь `alembic upgrade head` и откат.
      - Для API-изменений проверь PWA и capability-совместимость; контракт `/app/*` и `HomeMusicAndroid` не ломать.
      - Не оставляй незакоммиченные временные файлы и секреты.
      - Технический долг оформляй отдельным `td-*` change'ем по разделу «Технический долг (td-*)»; в функциональных change'ах правь его только там, где он блокирует задачу.
  archive:
    guidance:
      - Убедись, что спецификации отражают фактическое поведение.
      - Проверь, что в базовых спецификациях нет TODO и технического долга.
      - Убедись, что все задачи и проверки выполнены.
